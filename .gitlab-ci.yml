stages:
  - test

default:
  interruptible: true
  timeout: 45m

# The Opale GitLab instance provides a Docker runner tagged `deploy` and an
# Apple runner tagged `swift`. See Documentation/CONTINUOUS_INTEGRATION.md.
.swiftpm-tests:
  before_script:
    - mkdir -p .reports
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: .reports/*.xml

linux-package:
  stage: test
  extends: .swiftpm-tests
  image: swift:6.1
  tags:
    - deploy
  script:
    - swift --version
    - bash Documentation/verify-v2-resources.sh
    - swift build -c release
    # SwiftPM emits its XCTest xUnit report when tests run in parallel.
    - swift test --parallel --num-workers 2 --xunit-output .reports/linux-tests.xml

macos-package:
  stage: test
  extends: .swiftpm-tests
  tags:
    - swift
  variables:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  script:
    - xcodebuild -version
    - swift --version
    - bash Documentation/verify-v2-resources.sh
    - swift build -c release
    - swift test --parallel --xunit-output .reports/macos-tests.xml

ios-package:
  stage: test
  tags:
    - swift
  variables:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  before_script:
    - mkdir -p .reports
  script:
    - xcodebuild -version
    - swift --version
    # Compile the complete package for a physical iOS destination without
    # requiring a signing identity or provisioning profile.
    - >-
      xcodebuild build
      -scheme HL7Swift-Package
      -destination 'generic/platform=iOS'
      -derivedDataPath .derived-data
      CODE_SIGNING_ALLOWED=NO
      -quiet
    # Select the first iPhone from the newest installed iOS runtime instead of
    # relying on a device name that changes between Xcode releases.
    - IOS_RUNTIME=$(xcrun simctl list runtimes available | awk '/^iOS / { version=$2 } END { print version }')
    - test -n "$IOS_RUNTIME"
    - SIMULATOR_ID=$(xcrun simctl list devices available "iOS $IOS_RUNTIME" | grep -m1 'iPhone' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
    - test -n "$SIMULATOR_ID"
    - >-
      xcodebuild test
      -scheme HL7Swift-Package
      -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
      -derivedDataPath .derived-data
      -resultBundlePath .reports/ios-tests.xcresult
      CODE_SIGNING_ALLOWED=NO
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .reports/ios-tests.xcresult
