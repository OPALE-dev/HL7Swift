version: 2
updates:
  # One pull request a month for minor and patch updates, so that the macOS runners are not
  # flooded; major updates still come one by one.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # FHIRModels stays on 0.8.0, which the R4, R4B, and R5 adapters are qualified against.
      - dependency-name: "github.com/apple/fhirmodels"
    groups:
      swift-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
